name: barbershop_app
description: Barber Salon Management System - cross-platform client.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

# Keep this list short. Every new package must be justified in CHANGELOG.md.
dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  intl: ^0.20.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/

